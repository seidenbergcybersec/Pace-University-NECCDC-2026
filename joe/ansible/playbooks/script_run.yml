- name: Transfer and execute a binary or script.
  hosts: "{{ target | default('my_servers') }}"
  become: "{{ root | default(false) | bool }}"
  gather_facts: false  # Facts remain disabled
  vars_files:
    - ../vars/settings.yml
  vars:
    # Generate a timestamp once at the start of the play for the whole run
    run_timestamp: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"

  pre_tasks:
    - name: Ensure required variables are set
      run_once: true
      delegate_to: localhost
      ansible.builtin.assert:
        that:
          - script is defined and script | length > 0
          - local_results_path is defined and local_results_path | length > 0
        fail_msg: "CRITICAL ERROR: 'script' and 'local_results_path' must be defined."

  tasks:
    - name: Run binary or script
      ansible.builtin.script: "{{ script }} {{ script_args | default('') }}"
      register: shell_output
      ignore_errors: yes

    - name: Ensure local results directory exists
      delegate_to: localhost
      become: no
      # To avoid race conditions with multiple hosts creating the same parent dir:
      ansible.builtin.file:
        path: "{{ local_results_path }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: Append output to local audit file
      delegate_to: localhost
      become: no
      ansible.builtin.blockinfile:
        path: "{{ local_results_path }}/{{ inventory_hostname }}/execution.log"
        create: yes
        # Use the run_timestamp variable here. 
        # Since it's unique per run, it will append a NEW block every time you run the playbook.
        marker: "# --- EXECUTION {mark} ({{ run_timestamp }}) ---\n\n\n"
        insertafter: EOF
        block: |
          SCRIPT_PATH: {{ script }}
          ARGS: {{ script_args | default('None') }}
          RESULT: {{ 'SUCCESS' if shell_output.rc == 0 else 'FAILED (Exit Code: ' ~ shell_output.rc ~ ')' }}
          --- STDOUT ---
          {{ shell_output.stdout | default('No STDOUT') }}
          
          --- STDERR ---
          {{ shell_output.stderr | default('No STDERR') }}
      when: shell_output is defined
    
    - name: Final Log Location Summary
      run_once: true
      delegate_to: localhost
      debug:
        msg: "Logs for this run ({{ run_timestamp }}) have been saved to subfolders in: {{ local_results_path }}/"